<section class="product-category" id="croissants">
  <h2>Croissants</h2>
  <div class="scroll-carousel">
    {% for item in site.data.products.croissants %}
    <div class="carousel-card">
      <img 
        src="{{ item.image }}" 
        alt="{{ item.name }}" 
        class="gallery-thumb"
        data-index="{{ forloop.index0 }}"
        loading="lazy"
      >
      <p>{{ item.name }}</p>
    </div>
    {% endfor %}
  </div>
</section>

<!-- Modal -->
<div id="modal-gallery" class="modal hidden">
  <span class="modal-close">&times;</span>
  <img class="modal-main-img" src="" alt="">
  <div class="modal-thumbnails">
    {% for item in site.data.products.croissants %}
      <img 
        src="{{ item.image }}" 
        class="modal-thumb" 
        data-index="{{ forloop.index0 }}"
        alt="{{ item.name }}">
    {% endfor %}
  </div>
  <button class="modal-prev">&#10094;</button>
  <button class="modal-next">&#10095;</button>
</div>
